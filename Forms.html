<!DOCTYPE html>

<html lang="en">
    
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link href="css/mobiscroll.javascript.min.css" rel="stylesheet" />
    <script src="js/mobiscroll.javascript.min.js"></script>

</head>

<body>

    <h1>Student Registration Form</h1>
    <p>Please fill in your details to register for the course.</p>
    
    <form action="#" method="post" autocomplete="on">

        <fieldset>

            <legend>Personal Information</legend>

            <!-- Text Input -->
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" 
                    placeholder="Enter your fullname"
                    minlength="3" maxlength="50"
                    required autocomplete="name">
            <br><br>

            <!-- Email Input -->
            <label for="email">Email :</label>
            <input type="email" id="email" name="email"
                placeholder="Student@example.com" required>
            <br><br>


            <!-- Password Input -->
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                    minlength="8" maxlength="20"
                    placeholder="Minimum 8 characters" required>
            <br><br>

            <!-- Telephone Input -->
            <label for="telephone">Telephone:</label>
            <input type="tel" id="telephone" name="telephone"
                    placeholder="Enter your mobile number"
                    pattern="[0-9]{10}"
                    title="Enter a 10-digit mobile number"
                    required>
            <br><br>

            <!-- Number Input -->
            <label for="age">Age:</label>
            <input type="number" id="age" name="age"
                    min="16" max="60" step="1" value="18" required>
            <br><br>

            <!-- Date Input -->
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
            
            <!-- Time Input -->
            <label for="time">Preferred Time:</label>
            <input type="time" id="time" name="time" required>
            <br><br>

            <!-- Month Input -->
            <label for="month">Joining Month:</label>
            <input type="month" id="month" name="month" required>
            <br><br>

            <!-- Week Input -->
            <label for="week">Preferred Orientation Week:</label>
            <input type="week" id="week" name="week" required>
            <br><br>

            <!-- Datetime-local input-->
            <label for="meeting">Counselling Date and Time</label>
            <input type="datetime-local" id="meeting" name="meeting">
            <br><br>

            <!-- URL input-->
            <label for="portfolio">Portfolio Website</label>
            <input type="url" id="portfolio" name="portfolio"
                placeholder="https://example.com">
            <br><br>

            <!-- Radio buttons -->
            <p>Gender :</p>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female" required>
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other" required>
            <label for="other">Other</label>
            <br><br>

            <!-- Checkbox -->
             <p>Interests :</p>
             <input type="checkbox" id="web" name="interests" value="Web Devlopment">
             <label for="web">Web Devlopment</label>
             <input type="checkbox" id="java" name="interests" value="Java">
             <label for="java">Java</label>
             <input type="checkbox" id="ai" name="interests" value="AI">
             <label for="ai">Artificial Intelligence</label>
             <br><br>

             <!-- Select Dropdown -->
            <label for="course">Select Course :</label>
            <select id="course" name="course" required>
                <option value="">-- Select a Course --</option>
                <option value="Btech">B.tech CSE</option>
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
            </select>
            <br><br>

            <!-- Select dropdown-->
             <label for="clubs">Clubs :</label>
            <select id="clubs" name="clubs" multiple required style="width: 300px; height: 100px;" >
                <option value=""disabled>-- select a club --</option>
                <option value="Tech">Tech Club</option>
                <option value="Cultural">Cultural Club</option>
                <option value="Enterpreneur">Enterpreneur Club</option>
                <option value="Sports">Sports Club</option>
            </select>
            <br><br>

            <!-- Multiple selection using optgroup -->
             <label>Preferred Campus :
                <input mbsc-input id="my-input" data-dropdown="true"/>
             </label>
            <select id="multiple-group-select" name="campus" >
                <optgroup label="Rajasthan">
                    <option value="Jaipur">Jaipur</option>
                    <option value="Jodhpur">Jodhpur</option>
                </optgroup>
                <optgroup label="Other states">
                    <option value="Delhi">Delhi</option>
                    <option value="Gurugram">Gurugram</option>
                </optgroup>
            </select>

            

            <!-- Multiple selection using optgroup -->
             <label for="city">Preferred Campus :</label>
            <select id="city" name="campus" >
                <optgroup label="Rajasthan">
                    <option value="Jaipur">Jaipur</option>
                    <option value="Jodhpur">Jodhpur</option>
                </optgroup>
                <optgroup label="Other states">
                    <option value="Delhi">Delhi</option>
                    <option value="Gurugram">Gurugram</option>
                </optgroup>
            </select>
            <br><br>

            <!-- Datalist -->
            <label for="qualification">Previous Qualification :</label>
            <input list="qualifications" id="qualification"
                name="qualification" placeholder="Type or select">
            <datalist id="qualifications">
                <option value="Class 12">
                <option value="Diploma">
                <option value="Graduation">
            </datalist>
            <br><br>

            <!--Color input-->
            <label for="color">Choose Your Favourite Color :</label>
            <input type="color" id="color" name="color" value="#A600FF">
            <br><br>

            <!--Range Input-->
            <label for="confidence">Coding Confidence (1-10) :</label>
            <input type="range" id="confidence" name="confidence"
                min="1" max="10" value="5">
            <br><br>

            <!-- File input -->
            <label for="photo">Upload Photograph :</label>
            <input type="file" id="photo" name="photo" accept="image/">
            <br><br>

            <!-- Search Input-->
             <label for="search"> Search for a Course :</label>
             <input type="search" id="search" name="search" placeholder="Search courses">
            <br><br>

        </fieldset>

        <fieldset>

            <legend>Additional Information</legend>

            <!--Textarea-->
            <label for="address"> Address :</label>
            <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address"
                maxlength="200"></textarea>
            <br><br>

            <!-- Hidden input -->
            <input type="hidden" name="form_source" value="student_registration">

            <!-- Copnsent checkbox -->
            <input type="checkbox" id="terms" name="terms" value="accepted" required>
            <label for="terms">I agree to get registration terms.</label>
            <br><br>
            <input type="checkbox" id="notification" name="notification" value="accepted" required>
            <label for="notification">I agree to get notifications.</label>
            <br><br>

        </fieldset>

        <br><br>

        <!-- Submit and reset buttons -->
        <button type="submit"> Register </button>
        <button type="reset"> Clear Form </button>

        <!-- Input button examples -->
        <input type="button" value="Show Message" onclick="alert(' Welcome to the registration form! ')">
        
    </form>

    <script>

        mobiscroll.select('#multiple-group-select',{
            inputElement:document.getElementById('my-input'),
            touchUi: false,
            selectMultiple: true 
        });

    </script>

</body>

</html>
